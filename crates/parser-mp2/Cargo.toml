[package]
name = "vmkv-parser-mp2"
description = "VMKV parser for MPEG audio Layer I and II (.mp1, .mp2)"
version = "0.1.0"
edition.workspace = true

[lib]
name = "vmkv_parser_mp2"
path = "src/lib.rs"

[[bin]]
name = "vmkv-parser-mp2"
path = "src/main.rs"

[dependencies]
vtj = { path = "../vtj" }

[dev-dependencies]
vtj-stress = { path = "../vtj-stress" }
